<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>テームズ フロアマップメーカー FINAL</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}header{background:#0f172a;color:#fff;padding:calc(9px + env(safe-area-inset-top)) 12px 10px;flex:none}h1{font-size:19px;text-align:center;margin:0 0 9px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:760px;margin:auto}.tab{border:1px solid #64748b;background:#1e293b;color:#fff;border-radius:12px;padding:11px;font-weight:900;font-size:15px}.tab.active{background:#fff;color:#0f172a}main{position:relative;flex:1;min-height:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}iframe.active{display:block}</style></head><body><header><h1>テームズ フロアマップメーカー</h1><div class="tabs"><button class="tab active" data-floor="pachi">1F パチンコ</button><button class="tab" data-floor="slot">1F スロット</button></div></header><main><iframe id="pachi" class="active" src="pachi.html"></iframe><iframe id="slot" src="slot.html"></iframe></main><script>const frames={pachi:document.getElementById('pachi'),slot:document.getElementById('slot')};document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('iframe').forEach(x=>x.classList.remove('active'));btn.classList.add('active');frames[btn.dataset.floor].classList.add('active');});</script></body></html>
